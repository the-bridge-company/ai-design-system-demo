name: Bridge data

# Publishes the Bridge snapshot of the default branch to the orphan branch `bridge-data`: snapshot.json (the files
# the repo model reads, Figma coverage, contrast results), activity.json (open branches, suggestions, requests,
# recent merges and token history, read with the run token) and audits/<id>.json (adoption audits of the apps that use
# the design system). Hosted Bridge Studio and Library read it from raw.githubusercontent.com, which costs visitors no
# GitHub API quota and works without signing in on a public repository. Same mechanics as `bridge-visual`
# (visual-impact.yml): an orphan branch written by github-actions[bot], never merged anywhere.
# Without activity.json a signed-out visitor of /studio/the-bridge-company/ai-design-system-demo/ spends GitHub API requests
# (60 an hour per address) on every page; with it they spend none. It runs on the same events as
# templates/bridge-data.yml so the activity stays fresh, and the branch keeps one commit with the latest files.
#
# Token: the GITHUB_TOKEN of this run only, with `contents: write` to push the bridge-data branch and read access to
# pull requests, issues and checks. No other secret.
# Other teams: copy templates/bridge-data.yml (runs the published CLI with npx).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed, labeled]
  issues:
  issue_comment:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # One publish at a time; a newer event waits (GitHub keeps only the newest waiting run).
  group: bridge-data
  cancel-in-progress: false

permissions:
  contents: write # push to the bridge-data branch
  pull-requests: read # open branches, their files, reviews and comments
  issues: read # suggestions and requests
  checks: read # the checks of each branch
  statuses: read # previews and commit statuses

env:
  DATA_BRANCH: bridge-data

jobs:
  snapshot:
    name: Publish the Bridge snapshot
    # A manual run from another branch would publish another branch's snapshot. A pull request from a fork gets a
    # read-only token, so it cannot publish: the next push or scheduled run picks its changes up.
    if: >-
      (!(github.event_name == 'push' || github.event_name == 'workflow_dispatch') || github.ref_name == github.event.repository.default_branch)
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the default branch: on a pull request or issue event too, the snapshot is of the library as it is.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the bridge CLI
        run: npm run tokens:build && npm run mcp:build

      # Art print shop is a private product in another organisation: read with a read-only token on that repository.
      # Without the token (or when it has expired) the snapshot goes on without that audit.
      - name: Check out Art print shop
        id: shop
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: the-bridge-company/art-print-shop
          path: art-print-shop
          token: ${{ secrets.ART_PRINT_SHOP_TOKEN }}

      - name: Snapshot (repo model, activity, Figma coverage, adoption audits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOP_AUDIT: ${{ steps.shop.outcome == 'success' && 'art-print-shop/src=Art print shop, main' || '' }}
        # pipefail: a failed snapshot must stop the run, never publish an empty bridge-data branch.
        run: |
          set -o pipefail
          node packages/cli/dist/index.js snapshot --activity --out "$RUNNER_TEMP/bridge-data" \
            --audit-report apps/docs-site/src/data/audits \
            --audit "apps/admin/src=Bridge admin, main" \
            --audit "apps/docs-site/src=Bridge docs site, main" \
            ${SHOP_AUDIT:+--audit "$SHOP_AUDIT"} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Pictures for the adoption report: each audited product with a live address (products[].production) is opened on
      # the screens that hold its findings (products[].screens, else its file routes), with the Chrome of the runner and
      # the capture code of the exploration shots (scripts/preview-shots.mjs screens). The pictures go to the
      # bridge-shots branch (audits/<id>/), each report says where its pictures are before it is published. A screen is
      # captured again only for a new audited commit, a new address or after a day. Never blocks the data publish.
      - name: Check out the shots branch
        id: shots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shots"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git ls-remote --exit-code --heads "$remote" bridge-shots > /dev/null
          git clone -q --depth 1 --single-branch --branch bridge-shots "$remote" "$dir"
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "SHOTS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Pictures of the product screens
        id: screens
        if: steps.shots.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_CHROME_CHANNEL: chrome
        run: node scripts/preview-shots.mjs screens --data "$RUNNER_TEMP/bridge-data" --shots "$SHOTS_DIR" --config bridge.config.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the pictures
        if: steps.screens.outcome == 'success' && steps.screens.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$SHOTS_DIR"
          git add -A audits
          git commit -qm "adoption report pictures: ${{ steps.screens.outputs.captured }} captured" || { echo "Nothing new to publish"; exit 0; }
          # The preview-shots workflow writes the same branch (other folders): rebase on it and try again.
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:refs/heads/bridge-shots"; then exit 0; fi
            sleep $((i * 3))
            git fetch -q --depth 20 origin bridge-shots && git rebase -q FETCH_HEAD || true
          done
          exit 1

      - name: Publish to the bridge-data branch
        env:
          OUT: ${{ runner.temp }}/bridge-data
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/bridge-data-branch"
          head=$(git rev-parse HEAD)
          publish() {
            rm -rf "$dir"
            git worktree prune
            # One commit with the latest files, replaced on every run: activity.json changes every 30 minutes, and a
            # growing history of it would only weigh on clones.
            git branch -D "$DATA_BRANCH-next" > /dev/null 2>&1 || true
            git worktree add -q --detach "$dir" HEAD
            git -C "$dir" checkout -q --orphan "$DATA_BRANCH-next"
            git -C "$dir" rm -rfq --ignore-unmatch .
            cp -R "$OUT/." "$dir/"
            # "Not a problem" decisions are saved from Studio straight to this branch (audit-ignores.json) while the
            # snapshot runs: carry the branch's latest file forward, and replace only the tip it was read from. A
            # decision saved after that read makes the push fail and the next attempt carry it.
            tip=""
            if git ls-remote --exit-code -q origin "refs/heads/$DATA_BRANCH" > /dev/null; then
              git fetch -q --depth=1 origin "refs/heads/$DATA_BRANCH" || return 1
              tip=$(git rev-parse FETCH_HEAD) || return 1
              if git cat-file -e "$tip:audit-ignores.json" 2> /dev/null; then git show "$tip:audit-ignores.json" > "$dir/audit-ignores.json" || return 1; fi
            fi
            printf '# bridge-data\n\nBridge snapshot of %s at %s, written by .github/workflows/bridge-data.yml.\nsnapshot.json and activity.json are read by hosted Bridge Studio and Library; audits/ holds the adoption reports.\n' "$GITHUB_REPOSITORY" "${head:0:7}" > "$dir/README.md"
            # Vercel builds three projects from this repository, each from its own root directory. This branch has none
            # of them, so every push made three failed deployments that still bill build time. A vercel.json in each
            # root with Git deployments off makes Vercel skip the branch before any build starts.
            for root in apps/docs-site deploy/storybook apps/admin; do
              mkdir -p "$dir/$root"
              printf '{ "git": { "deploymentEnabled": false } }\n' > "$dir/$root/vercel.json"
            done
            git -C "$dir" add -A
            git -C "$dir" commit -qm "bridge data: ${head:0:7}"
            git -C "$dir" push -q --force-with-lease="refs/heads/$DATA_BRANCH:$tip" origin "HEAD:refs/heads/$DATA_BRANCH"
          }
          for i in 1 2 3; do
            if publish; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
